name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npx astro build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # IndexNow: avisa a Bing en cuanto se despliega, en vez de esperar a que
      # pase el rastreador, que en un sitio nuevo y sin enlaces puede tardar
      # semanas. Importa más de lo habitual aquí porque la búsqueda web de
      # ChatGPT y Copilot se apoya en el índice de Bing: lo que Bing no ha
      # rastreado, esos modelos no lo pueden citar.
      - name: Ping IndexNow
        run: |
          urls=$(curl -s https://dearwander.com/sitemap-0.xml \
                 | grep -oE '<loc>[^<]+' | sed 's/<loc>//' \
                 | head -100 | sed 's/.*/"&"/' | paste -sd, -)
          curl -sS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json' \
            -d "{\"host\":\"dearwander.com\",\"key\":\"af662e02b4bd65bc9d2f96781de70405\",\"keyLocation\":\"https://dearwander.com/af662e02b4bd65bc9d2f96781de70405.txt\",\"urlList\":[$urls]}" \
            -w '\n  respuesta: %{http_code}\n'
